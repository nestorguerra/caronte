name: Caronte Book Queue Recovery

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caronte-book-recovery
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recover:
    # Local preparation is not activation. Manual runs obey the same gate.
    if: ${{ vars.CARONTE_BOOK_RECOVERY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: caronte-book-operations
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout approved default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup existing Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Request one recovery claim
        run: node scripts/wake-caronte-book-queue.mjs
        env:
          CARONTE_BOOK_RECOVERY_ENABLED: ${{ vars.CARONTE_BOOK_RECOVERY_ENABLED }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          FUNCTIONS_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL }}
          CARONTE_BOOK_WORKER_SECRET: ${{ secrets.CARONTE_BOOK_WORKER_SECRET }}
