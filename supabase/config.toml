project_id = "licitia-production"

[auth]
site_url = "https://nestorguerra.github.io/licitia-v2-production/"
additional_redirect_urls = [
  "https://nestorguerra.github.io/licitia-v2-production/**",
  "http://127.0.0.1:8765/**",
  "http://localhost:8765/**"
]
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Activa tu cuenta en LicitIA"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera tu acceso a LicitIA"
content_path = "./supabase/templates/recovery.html"

